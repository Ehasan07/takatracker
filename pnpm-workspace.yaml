packages:
  - 'apps/*'
  - 'packages/*'

# Native/postinstall builds we deliberately allow (pnpm blocks them by default).
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
